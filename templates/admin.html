<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N-System — Админка заявок</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 1060px; margin: 0 auto; padding: 28px 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 24px; color: #f8fafc; }
    a { color: #38bdf8; text-decoration: none; font-size: 14px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn {
      background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
      padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .filter-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }
    .table-wrap { overflow-x: auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-weight: 600; background: #172033; }
    select { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 6px 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Заявки сервисного центра</h1>
      <a href="/">← На лендинг</a>
    </header>
    <div class="toolbar" id="filters">
      <button class="filter-btn active" data-filter="all">Все (0)</button>
      <button class="filter-btn" data-filter="new">🆕 Новые (0)</button>
      <button class="filter-btn" data-filter="in_progress">⚙️ В работе (0)</button>
      <button class="filter-btn" data-filter="closed">✅ Закрытые (0)</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Дата</th>
            <th>Клиент</th>
            <th>Телефон</th>
            <th>Устройство</th>
            <th>Проблема</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </div>
  </div>
  <script>
    const tbody = document.getElementById("leadsBody");
    const filterButtons = [...document.querySelectorAll(".filter-btn")];
    let allLeads = [];
    let currentFilter = "all";

    const statuses = [
      ["new", "🆕 Новая"],
      ["in_progress", "⚙️ В работе"],
      ["closed", "✅ Закрыта"],
    ];

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        currentFilter = btn.dataset.filter;
        filterButtons.forEach(b => b.classList.toggle("active", b === btn));
        renderTable();
      });
    });

    function updateCounts() {
      const counts = {
        all: allLeads.length,
        new: allLeads.filter(x => x.status === "new").length,
        in_progress: allLeads.filter(x => x.status === "in_progress").length,
        closed: allLeads.filter(x => x.status === "closed").length,
      };
      const labels = {
        all: "Все",
        new: "🆕 Новые",
        in_progress: "⚙️ В работе",
        closed: "✅ Закрытые",
      };
      filterButtons.forEach(b => {
        const key = b.dataset.filter;
        b.textContent = `${labels[key]} (${counts[key]})`;
      });
    }

    function renderTable() {
      const rows = currentFilter === "all"
        ? allLeads
        : allLeads.filter(x => x.status === currentFilter);
      tbody.innerHTML = "";
      for (const r of rows) {
        const tr = document.createElement("tr");
        const opts = statuses.map(([val, lbl]) =>
          `<option value="${val}" ${r.status === val ? "selected" : ""}>${lbl}</option>`
        ).join("");
        tr.innerHTML = `
          <td>${r.id}</td>
          <td>${r.created_at}</td>
          <td>${escapeHtml(r.client_name)}</td>
          <td>${escapeHtml(r.phone)}</td>
          <td>${escapeHtml(r.device)}</td>
          <td>${escapeHtml(r.problem || "")}</td>
          <td><select onchange="changeStatus(${r.id}, this.value)">${opts}</select></td>
        `;
        tbody.appendChild(tr);
      }
    }

    async function loadLeads() {
      const res = await fetch("/api/leads");
      allLeads = await res.json();
      updateCounts();
      renderTable();
    }

    async function changeStatus(id, status) {
      await fetch(`/api/leads/${id}/status`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status }),
      });
      const item = allLeads.find(x => x.id === id);
      if (item) item.status = status;
      updateCounts();
      if (currentFilter !== "all") renderTable();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[s]));
    }

    loadLeads();
  </script>
</body>
</html>
